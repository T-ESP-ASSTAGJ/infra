apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jamly-api-secrets
  namespace: jamly-api
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-kv
    kind: SecretStore
  target:
    name: jamly-api-secrets
    creationPolicy: Owner
  data:
  - secretKey: APP_SECRET
    remoteRef:
      key: app-secret
  - secretKey: MERCURE_JWT_SECRET
    remoteRef:
      key: mercure-jwt-secret
  - secretKey: DATABASE_URL
    remoteRef:
      key: database-url
  - secretKey: MAILER_DSN
    remoteRef:
      key: mailer-dsn
  - secretKey: JWT_PASSPHRASE
    remoteRef:
      key: jwt-passphrase
  - secretKey: AZURE_STORAGE_ACCOUNT_KEY
    remoteRef:
      key: azure-storage-account-key
  - secretKey: AZURE_STORAGE_CONNECTION_STRING
    remoteRef:
      key: azure-storage-connection-string
